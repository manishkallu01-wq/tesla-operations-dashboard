name: ci
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/validate_project.py
      - run: pip install -r server/requirements.txt
      - run: pytest -q
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
